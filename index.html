<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Electrical Jankari</title>
<style>
  body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f0f2f5; }
  .header { background-color: #0056b3; color: #ffffff; padding: 15px 20px; text-align: center; }
  .top-bar { font-size: 14px; text-transform: uppercase; margin-bottom: 5px; color: #a8d1ff; }
  .main-title { font-size: 28px; font-weight: bold; }
  .container { max-width: 800px; margin: 20px auto; background: #ffffff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
  section { margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid #ddd; }
  h2 { color: #333; font-size: 22px; }
  select, input, button { width: 100%; padding: 10px; margin-top: 10px; margin-bottom: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
  button { background-color: #0056b3; color: white; border: none; cursor: pointer; font-size: 16px; }
  button:hover { background-color: #004494; }
  .content-box { background-color: #e9f1f7; padding: 15px; border-left: 4px solid #0056b3; margin-top: 10px; display: none; }
</style>
</head>
<body>

<div class="header">
  <div class="top-bar">Welcome to Electrical Jankari</div>
  <div class="main-title">सही जानकारी, सही सुरक्षा और ज्ञान</div>
</div>

<div class="container">
  
  <section>
    <h2>महत्वपूर्ण इलेक्ट्रिकल फॉर्मूलाज़</h2>
    <select id="formulaSelect" onchange="showFormula()">
      <option value="">-- फॉर्मूला चुनें --</option>
      <option value="ohm">ओम का नियम (Ohm's Law)</option>
      <option value="power">इलेक्ट्रिकल पावर (Electrical Power)</option>
    </select>
    <div id="formulaDisplay" class="content-box"></div>
  </section>

  <section>
    <h2>इलेक्ट्रिकल कैलकुलेटर</h2>
    <select id="calcSelect" onchange="showCalculator()">
      <option value="">-- कैलकुलेटर चुनें --</option>
      <option value="kwToAmps">kW to Amps (सिंगल फेज)</option>
      <option value="hpToKw">HP to kW</option>
    </select>
    
    <div id="calcInputs" style="display:none;">
      <div id="inputsContent"></div>
      <button onclick="calculate()">कैलकुलेट करें</button>
      <div id="resultOutput" style="font-weight:bold; margin-top:10px;"></div>
    </div>
  </section>

</div>

<script>
  function showFormula() {
    var select = document.getElementById("formulaSelect");
    var display = document.getElementById("formulaDisplay");
    var formulas = {
      "ohm": "ओम का नियम: V = I x R (जहाँ V=Voltage, I=Current, R=Resistance)",
      "power": "इलेक्ट्रिकल पावर: P = V x I (जहाँ P=Power, V=Voltage, I=Current)"
    };
    if (formulas[select.value]) {
      display.innerHTML = formulas[select.value];
      display.style.display = "block";
    } else {
      display.style.display = "none";
    }
  }

  function showCalculator() {
    var select = document.getElementById("calcSelect");
    var calcInputs = document.getElementById("calcInputs");
    var inputsContent = document.getElementById("inputsContent");
    if (select.value === "") { calcInputs.style.display = "none"; return; }
    var html = "";
    if (select.value === "kwToAmps") {
      html = '<label>kW दर्ज करें:</label><input type="number" id="kwInput" placeholder="उदा. 5">' +
             '<label>वोल्टेज दर्ज करें:</label><input type="number" id="voltInput" placeholder="उदा. 220">';
    } else if (select.value === "hpToKw") {
      html = '<label>HP दर्ज करें:</label><input type="number" id="hpInput" placeholder="उदा. 10">';
    }
    inputsContent.innerHTML = html;
    calcInputs.style.display = "block";
  }

  function calculate() {
    var select = document.getElementById("calcSelect");
    var resultOutput = document.getElementById("resultOutput");
    if (select.value === "kwToAmps") {
      var kw = parseFloat(document.getElementById("kwInput").value);
      var volt = parseFloat(document.getElementById("voltInput").value);
      if (!isNaN(kw) && !isNaN(volt) && volt !== 0) {
        var amps = (kw * 1000) / volt;
        resultOutput.innerHTML = "परिणाम: " + amps.toFixed(2) + " Amps";
      } else { resultOutput.innerHTML = "कृपया सही मान दर्ज करें।"; }
    } else if (select.value === "hpToKw") {
      var hp = parseFloat(document.getElementById("hpInput").value);
      if (!isNaN(hp)) {
        var kw = hp * 0.7457;
        resultOutput.innerHTML = "परिणाम: " + kw.toFixed(2) + " kW";
      } else { resultOutput.innerHTML = "कृपया सही HP दर्ज करें।"; }
    }
  }
</script>

</body>
</html>
